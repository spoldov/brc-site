<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newsletter · BRC</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#17181c}a:hover{color:#a80022}
/* header and widths matched to the homepage */
.shdr{max-width:1344px; margin:0 auto; padding:8px 32px; min-height:64px; box-sizing:border-box; display:flex; flex-wrap:wrap; gap:4px 24px; align-items:baseline; align-content:center; justify-content:space-between}
.sbrand{display:flex; align-items:baseline; gap:12px; text-decoration:none; color:#ffffff}
.slogo b{font-family:Archivo,Arial,sans-serif; font-stretch:115%; font-weight:800; font-size:23px; line-height:1; letter-spacing:-0.02em}
.sname{font-size:15px; font-weight:600; white-space:nowrap}
.sred{color:#ffffff; background:radial-gradient(70rem 36rem at 105% 115%, rgba(60,0,14,.55), transparent 62%), linear-gradient(120deg, #dc002d 0%, #cf002a 45%, #a8001f 100%)}
#price{white-space:nowrap}
h1{overflow-wrap:anywhere}
@media (max-width:720px){
  .shdr{padding:8px 20px}
  .sname{display:none}
  .shdr > div > a:not([hreflang]){display:none}  /* phones: no back link, BRC links home; header stays on one line */
  [style*="max-width: 1280px"]{padding-left:20px !important; padding-right:20px !important}
  #price{font-size:clamp(30px, 9.4vw, 52px) !important}
}
/* footer (same content as the homepage footer, slimmer) */
.sfoot{padding:0 16px 16px; margin-top:64px}
.sfoot-box{border-radius:28px}
.sfoot-in{max-width:1280px; margin:0 auto; padding:36px 32px 30px; display:flex; flex-direction:column; gap:24px; font-size:15px; line-height:1.55}
.sfoot a{color:#ffffff}
.sfoot-contact{font-size:17px}
.sfoot-base{border-top:1px solid rgba(255,255,255,.5); padding-top:24px; display:flex; flex-wrap:wrap; gap:16px 32px; align-items:center; justify-content:space-between}
.sfoot-rug{flex:none; background:#ffffff; border-radius:10px; padding:14px 18px; display:block}
.sfoot-rug img{display:block; width:220px; height:auto}
@media (max-width:720px){
  .sfoot{padding:0 8px 8px}
  .sfoot-box{border-radius:20px}
  .sfoot-in{padding:28px 20px 24px}
  .sfoot-base{flex-direction:column; align-items:flex-start}
  .sfoot-base span{flex:none !important}
}
</style>
</helmet>
<div style="font-family: Inter, 'Segoe UI', Arial, sans-serif; color: #17181c; background: #f7f8f9; font-size: 18px; line-height: 1.55">
<div class="sred">
<header class="shdr">
<a class="sbrand" href="C-TenWeeks.dc.html" aria-label="BRC, Business Research &amp; Consulting, home"><span class="slogo"><b>BRC</b></span><span class="sname">Business Research &amp; Consulting</span></a>
<a href="C-TenWeeks.dc.html" style="color: #ffffff; font-weight: 600; font-size: 16px; padding: 12px 0">← Back to the homepage</a>
</header>
</div>
<div style="max-width: 1280px; margin: 0 auto; padding: 96px 32px 160px; display: flex; flex-direction: column; gap: 20px; align-items: flex-start">
<h1 style="margin: 0; font-family: Archivo, Arial, sans-serif; font-stretch: 112%; font-weight: 800; font-size: clamp(32px, 4.4vw, 60px); line-height: 1; letter-spacing: -0.025em">Newsletter</h1>
<p style="margin: 0; max-width: 36em; color: #42464d">Placeholder. Here you will be able to sign up for the BRC newsletter and read earlier issues, with recent cases and what clients say about working with our teams.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#dc002d","options":["#dc002d","#b5121b","#8f1d2c"]},"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#dc002d' };
}
}
</script>
</body>
</html>
